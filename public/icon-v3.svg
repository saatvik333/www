<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- BBlack icon: the site's petal logo (static "simple" orientation --
       one bud facing down, two out upwards), synced from ~/.bblack/colors.json.
       Bolder stroke than the page mark so it stays vivid at favicon sizes -->
  <rect width="200" height="200" rx="36" fill="#000000" stroke="#2f2f2f" stroke-width="3"/>
  <g transform="translate(100 100) scale(0.92) translate(-100 -100)"
     fill="none" stroke="#3584e4" stroke-width="22"
     stroke-linecap="butt" stroke-linejoin="bevel">
    <path d="M 35 40 A 35 35 0 1 1 55 100 A 35 35 0 1 1 35 160" transform="translate(60.8 0)"/>
    <path d="M 35 40 A 35 35 0 1 1 55 100 A 35 35 0 1 1 35 160" transform="rotate(120 100 100) translate(60.8 0)"/>
    <path d="M 35 40 A 35 35 0 1 1 55 100 A 35 35 0 1 1 35 160" transform="rotate(-120 100 100) translate(60.8 0)"/>
  </g>
</svg>
